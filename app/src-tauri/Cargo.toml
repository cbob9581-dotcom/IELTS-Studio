[package]
name = "ielts-desktop"
version = "0.6.0"
edition = "2021"

[lib]
name = "ielts_core"
crate-type = ["lib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]
verification = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
jsonschema = { version = "0.29", default-features = false }
keyring-core = "1"
windows-native-keyring-store = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
png = "0.17"
font8x8 = "0.3"
lopdf = { version = "0.45.0", default-features = false }
regex = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "ielts-desktop"
path = "src/main.rs"
required-features = ["desktop"]
